name: Validate inference images

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate manifests, paths, pins, and shell syntax
        run: ./scripts/validate-repository.sh

      - name: Require release notes for build-affecting changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/validate-release-notes.sh --changed-since "$BASE_SHA"

      - name: Run pinned ShellCheck
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            scripts/*.sh

      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
